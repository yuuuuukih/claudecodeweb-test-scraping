version: '3.8'

services:
  # Selenium Standalone Chrome サービス
  selenium:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
      - "7900:7900"  # noVNC (ブラウザからアクセス可能)
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=300
    volumes:
      - /dev/shm:/dev/shm

  # スクレイパー実行環境
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - selenium
    volumes:
      - .:/app
      - ./output:/app/output
    environment:
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
    working_dir: /app
    command: tail -f /dev/null  # コンテナを起動したまま維持
